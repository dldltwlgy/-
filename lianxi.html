<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    .site {
        position: relative;
        width: 100vw;
        height: 100vh;
        background-color: #05050a;
    }

    .beijin {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
    }

    .beijin img {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
    }

    .box {
        position: absolute;
        top: 3%;
        left: 90%;
        transform: translate(-50%, -50%);
        width: 25vw;
        height: 5vh;
        background: linear-gradient(to right rgba(91, 227, 17, 0.473), rgba(6, 244, 6, 0.144) 50%, rgba(239, 237, 237, 0.03));

        z-index: 1;
    }

    .w1 {
        position: absolute;
        top: 0%;
        left: 0%;
        ;
    }

    .button1 {
        display: inline-block;
        width: 10vmin;
        height: auto;
        transition: all 0.3s;
        z-index: 2;

    }

    .selin {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 10vmin;
        height: auto;
        opacity: 0;
        transition: all 0.3s;
        pointer-events: none;
        z-index: 100;
    }

    .w1:hover .selin {
        opacity: 1;
        visibility: visible;
        left: 100%;
    }

    .w2 {
        position: absolute;
        top: 0%;
        left: 30%;

    }

    .button2 {
        padding: 1vh 2vw;
        font-size: 2vh;
        color: rgba(13, 13, 13, 0.916);

        display: inline-block;
        white-space: nowrap;
        height: auto;
        transition: all 0.3s;
        background-color: transparent;
        border: none;

    }

    .xiao {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 10vmin;
        height: auto;
        opacity: 0;
        transition: all 0.3s;
        pointer-events: none;
        z-index: 100;
    }

    .w2:hover .xiao {
        opacity: 1;
        visibility: visible;
        left: 100%;
    }

    .site2 {
        position: relative;
        width: 100vw;
        min-height: 100vh;
        height: auto;
        background-color: #05050a;
    }



    .ye {
        display: block;
        width: 100%;
        height: 100vh;
        object-fit: contain;
    }


    .header {
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        gap: 30px;
        z-index: 90;
    }

    .header .logo {
        width: 8vw;
        height: 8vh;
        z-index: 2;
    }

    .header .logo h1 {
        width: 100%;
        height: 100%;
    }

    .header .logo a {
        display: inline-block;
        width: 100%;
        height: 100%;
        background: url('logo.6f1f5d4a.png')no-repeat center /contain;
        text-indent: -9999px;
        z-index: 2;
    }

    .header .nav {
        width: 40vw;
        height: 8vh;
        display: flex;
        align-items: center;
        gap: 30px;
        background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0));
        z-index: 90;
    }

    .header .nav .ying {
        display: block;
        width: 10vw;
        height: 6vh;
        background: url('emuseum.83bdf6aa.png') no-repeat center / contain;
        filter: brightness(1.8) saturate(1.1);
        transition: 0.3s;
        cursor: pointer;
    }

    .header .nav .ying:hover {
        filter: brightness(3.2) saturate(1.6);
    }

    .xiang:active {
        filter: brightness(3.2) saturate(1.6);
    }

    .header .nav .back {
        display: inline-block;
        white-space: nowrap;
        padding: 0;
        border: none;
        background: transparent;
        -webkit-appearance: none;
        font-size: 3vh;
        color: red;
        cursor: pointer;
    }

    .background {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: url('bg.27aa7c07.jpg') no-repeat center / cover;
    }

    .site4 {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 400;
        background-color: #05050a;
    }

    .slider {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
    }

    .photos {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .photos img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .slider .kong {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: #ddd;
        font-size: 2vh;
        text-align: center;
    }

    ::-webkit-scrollbar {
        width: 1px;
        height: 1px;
    }

    .albums {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding-top: 8vh;
        width: 100vh;
        transform: rotate(-90deg) translate3d(0, -100vh, 0);
        transform-origin: right top;
        overflow: hidden auto;
        height: 100vw;
        perspective: 1px;
        transform-style: preserve-3d;
        z-index: 2;
    }

    .backggg {
        background: linear-gradient(-225deg, #FFE29F 0%, #FFA99F 48%, #FF719A 100%);
    }

    .bback {

        position: fixed;
        top: 2vh;
        right: 2vw;
        z-index: 100;
        width: 8vh;
        height: 6vh;
        background: linear-gradient(rgba(40, 198, 209, 0.541), rgba(42, 226, 70, 0.39));
        border: 1px solid #a4e78c;
        padding: 1px;
        font-size: 2vh;
        color: #a4e78c;
        cursor: pointer;
        z-index: 2;
    }



    .album {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 30vh;
        transform-origin: center center;
        transform: rotate(90deg) translateZ(0.1px) scale(1.1) translateY(2vh);
        transition: 1s;
    }

    .album img {
        max-width: 30vh;
        max-height: 30vh;
        border: #fff solid 10px;
        transition: 0.5s;
    }

    .album .kong {
        width: 100%;
        height: 100%;
        background: rgba(155, 249, 129, 0.5);
        border-radius: 10px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }

    .album:hover img {
        box-shadow: 0 10px 30px #86c4f7;
        transform: scale(1.05);
    }

    .create {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5vh;
        width: 26vh;
        height: 26vh;
        border: 1px dashed rgba(255, 255, 255, 0.45);
        border-radius: 6px;
        color: #ddd;
        font-size: 1.8vh;
        cursor: pointer;
        transition: 0.3s;
    }

    .create:hover {
        border-color: #86c4f7;
        color: #86c4f7;
    }

    .slower {
        transform: rotate(90deg) translateZ(-.12px) scale(1.3) translateY(-8vh);
    }

    .slower1 {
        transform: rotate(90deg) translateZ(-.25px) scale(1.35) translateY(2vh);
    }

    .slower-down {
        transform: rotate(90deg) translateZ(-.1px) scale(1) translateY(16vh);
    }

    .faster {
        transform: rotate(90deg) translateZ(-.05px) scale(1.1) translateY(15vh);
    }

    .faster1 {
        transform: rotate(90deg) translateZ(.05px) scale(1.7) translateY(10vh);
    }

    .fastest {
        transform: rotate(90deg) translateZ(.22px) scale(0.7) translateX(-10vh) translateY(-15vh);
    }

    .vertical {
        transform: rotate(90deg) translateZ(-.1px) scale(1.6) translateY(-3vh);
    }

    .site3 {
        position: relative;
        width: 100vw;
        min-height: 100vh;
        height: auto;
        background-color: #05050a;
    }

    .arrrow,
    .baa,
    .choose {
        position: absolute;
        z-index: 4;
        padding: 1vh 1.5vw;
        font-size: 2.2vh;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid #555;
        border-radius: 8px;
        cursor: pointer;
    }

    .arrrow.left {
        left: 2vw;
        top: 50%;
        transform: translateY(-50%);
    }

    .arrrow.right {
        right: 2vw;
        top: 50%;
        transform: translateY(-50%);
    }

    .baa {
        left: 2vw;
        top: 2vh;
    }

    .choose {
        right: 2vw;
        top: 2vh;
    }
</style>


<body>
    <div class="site" id="site" style="display: block;">
        <div class="beijin">
            <img src="微信图片_20261103102446_160_4.png" alt="tu">

        </div>
        <div class="box">
            <div class="w1">
                <img src="logo.6f1f5d4a.png" alt="wiu" class="button1" onclick="wuqi()">
                <img src="1793367044694903700_Snipaste_2026-10-29_20-00-29.png" alt="ww" class="selin">
            </div>
            <div class="w2">
                <button class="button2" onclick="jinru2()">小熊猫</button>
                <img src="微信图片_20261018171655_100_4.png" alt="www" class="xiao">
            </div>

        </div>
    </div>
    <div class="site2" id="site2" style="display: none;">
        <video class="ye" src="cf38ce4c2f511d56.mp4" muted loop autoplay playsinline preload="auto"></video>
        <div class="background" id="background">
            <div class="albums" id="albums2"></div>
        </div>
        <div class="header">
            <div class="logo">
                <h1>
                    <a href="https://www.biligame.com/detail/?id=107111&sourceFrom=2000040011&spm_id_from=333.337.0.0">无期迷途
                    </a>
                </h1>
            </div>
            <div class="nav">
                <div class="ying" onclick="tiao('background')"></div>
                <button class="back" onclick="back()">返回</button>
            </div>
        </div>
    </div>
    <div class="site3" id="site3" style="display: none;">
        <div class="albums backggg" id="albums" style="display: none;"></div>
        <button class="bback" onclick="bbback()">返回</button>




        <script>
            const photos = [
                {
                    url: '微信图片_20261103101707_153_4.jpg'
                },
                {
                    url: '微信图片_20261103102318_154_4.png'
                },
                {
                    url: '微信图片_20261103102355_156_4.png'
                },
                {
                    url: '微信图片_20261103102441_159_4.png'
                },
                {
                    url: '微信图片_20261103102446_160_4.png'
                }
            ]

            const random = Math.floor(Math.random() * photos.length)
            const img = document.querySelector('.beijin img')
            // setInterval是定时器ms为单位
            let i = random
            setInterval(function () {
                i = (i + 1) % photos.length
                img.src = photos[i].url
            }, 5000)

            function wuqi() {
                document.getElementById("site").style.display = 'none'
                document.getElementById("site2").style.display = 'block'

            }
            function back() {
                document.getElementById("site").style.display = 'block'
                document.getElementById("site2").style.display = 'none'
            }
            function bbback() {
                document.getElementById("site").style.display = 'block'
                document.getElementById("site3").style.display = 'none'

            }
            function jinru2() {
                document.getElementById("site").style.display = 'none'
                document.getElementById("site3").style.display = 'block'
                document.getElementById("albums").style.display = 'flex'
            }

            function tiao(id) {
                document.getElementById(id).scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                })
            }

            let now = 0;
            let he = 0;
            let zu = 'ying';
            let albumsYing = [];
            let albumsXiong = [];
            let albums = [];
            let nowalbum = 0;
            async function loadAll() {
                await refreshGroup('ying');
                await refreshGroup('xiong');
                showAlbums();
            }
            loadAll();
            async function refreshGroup(z) {
                let list = await getAlbums(z);
                if (z === 'xiong') albumsXiong = list;
                else albumsYing = list;
                return list;
            }
            async function getAlbums(z) {//获取ying或者xiong相册
                try {
                    let res = await fetch('/api/albums?group=' + z);//向后端请求相册
                    let data = await res.json();
                    return data.albums || [];
                } catch (e) {//如果请求失败，就空相册
                    return [];
                }
            }

            function showAlbums() {
                document.getElementById("albums2").innerHTML = buildWall(albumsYing, 'ying');
                document.getElementById("albums").innerHTML = buildWall(albumsXiong, 'xiong');
            }
            const lanes = ['slower', 'faster', 'vertical', 'slower-down',
                'faster1', 'slower1', 'fastest', ''];
            function buildWall(list, z) {
                let html = "";
                for (let i = 0; i < list.length; i++) {
                    let photos = list[i].photos;
                    let feng = photos.length > 0
                        ? '<img src="' + photos[0] + '" alt="封面">'
                        : '<div class="create"><span>暂无照片</span></div>';
                    html += '<div class="album ' + lanes[i % lanes.length] + '" onclick="openAlbum(' + i + ',\'' + z + '\')">' + feng + '</div>';
                }
                html += '<div class="album"><div class="create" onclick="createAlbum(\'' + z + '\')"><span>新建相册</span></div></div>';
                return html;

            }
            function openAlbum(i, z) {
                nowalbum = i;
                now = 0;
                z = z || 'ying';
                zu = z;                                              //记住当前是影像馆还是小熊猫
                albums = z === 'xiong' ? albumsXiong : albumsYing;    //赋值     
                let photos = albums[i].photos;
                he = photos.length;
                let html = "";
                if (he === 0) {
                    html = '<div class="kong"> 暂无照片</div>';
                }
                else {
                    for (let k = 0; k < he; k++) {
                        html = html + '<div class="photos" id="img' + k + '"><img src="' + photos[k] + '"></div>';
                    }
                }
                document.getElementById("slider").innerHTML = html;
                if (zu === 'xiong') document.getElementById("albums").style.display = "none";
                else document.getElementById("albums2").style.display = "none";
                document.getElementById("site4").style.display = "block";
                show();
            }
            function show() {
                for (let i = 0; i < he; i++) {
                    document.getElementById("img" + i).style.display = "none";
                }
                document.getElementById("img" + now).style.display = "block";
            }
            function shang() {
                now = now - 1;
                if (now < 0) {
                    now = he - 1;
                }
                show();
            }
            function xia() {
                now = now + 1;
                if (now >= he) {
                    now = 0;
                }
                show();
            }



            function choose() {
                document.getElementById("choose").click();
            }

            async function upload(input) {//下面那个input是选择的文件
                let tup = new FormData();
                for (let i = 0; i < input.files.length; i++) {
                    tup.append("photos", input.files[i]);//append 键名 值
                }
                let res = await fetch("/upload?album=" + nowalbum + "&group=" + zu, {
                    body: tup,
                    method: "post",
                });
                if (!res.ok) {
                    alert("上传失败");
                    return;
                }
                await refreshGroup(zu);
                showAlbums();
                openAlbum(nowalbum, zu);
                input.value = "";
            }

            async function createAlbum(z) {
                let xiangce = new FormData();
                let res = await fetch("/api/albums?group=" + z, {
                    body: xiangce,
                    method: "post",
                });
                if (!res.ok) {
                    alert("创建失败");
                    return;
                }
                await refreshGroup(z);
                let list = z === 'xiong' ? albumsXiong : albumsYing;
                showAlbums();
                openAlbum(list.length - 1, z);
            }


            function goback() {
                document.getElementById("site4").style.display = "none";
                if (zu === 'xiong') {
                    document.getElementById("albums").style.display = "flex";
                } else {
                    document.getElementById("albums2").style.display = "flex";
                }
            }



        </script>
    </div>

    <div class="site4" id="site4" style="display: none;">
        <div class="slider" id="slider"></div>
        <button class="arrrow left" onclick="shang()">‹</button>
        <button class="arrrow right" onclick="xia()">›</button>
        <button class="baa" onclick="goback()">返回</button>
        <button class="choose" onclick="choose()">选择图片</button>
        <input type="file" id="choose" accept="image/*,video/*" multiple style="display: none;"
            onchange="upload(this)">//一选好文件就触发upload
    </div>

</body>

</html>
